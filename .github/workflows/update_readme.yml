name: Update Recent Activity

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: jaywcjlove/github-action-readme@main
        with:
          start_marker: "<!--RECENT_ACTIVITY:start-->"
          end_marker: "<!--RECENT_ACTIVITY:end-->"
